interface:
  display_name: "投标清标"
  short_description: "汇总同一项目多家标书交叉检查，生成三级预警清标报告"
  default_prompt: "请提供：1) 项目目录（含 project.yaml 与 bids/供应商目录）；2) 投标截止时间；3) 采购文件中的资格/否决条款来源；4) 外部查询方式（offline 离线 / manual_import 仅证据导入 / live 指定渠道）。默认只读取本地文件、已缓存 OCR 和外部证据；扫描页 OCR 由宿主 Agent 提供 ocr-result.v1 后导入。外部仅保留中国政府采购网和富奥 SRM；如需 SRM 在线访问，请使用当前授权浏览器会话或提供授权导出文件放入 external-evidence/srm-authorized-export/。"
